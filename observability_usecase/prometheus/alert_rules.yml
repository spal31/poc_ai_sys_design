groups:

- name: payment-alerts

  rules:

  - alert: HighLatency

    expr: histogram_quantile(
            0.95,
            rate(http_server_request_duration_bucket[5m])
          ) > 1

    for: 2m

    labels:
      severity: critical

    annotations:
      summary: "95 percentile latency above 1 second"


  - alert: HighErrorRate

    expr: rate(http_server_request_count{http_status_code="500"}[5m]) > 2

    for: 1m

    labels:
      severity: warning

    annotations:
      summary: "Too many HTTP 500 errors"


  - alert: HighRAM

    expr: system_ram_usage_mb > 900

    for: 5m

    labels:
      severity: critical