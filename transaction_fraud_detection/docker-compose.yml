services:

  kafka:
    image: apache/kafka:4.1.0
    container_name: fraud-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # FIXED: Changed controller address to use localhost internally for the broker container
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Listeners
      # FIXED: Bound internal listeners to 0.0.0.0 so they listen on all interfaces inside the container
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://fraud-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-node development configuration
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # --- OPTIMIZATION: Reduce Kafka JVM Heap size ---
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
      KAFKA_GROUP_COORDINATOR_NUM_THREADS: 1
      KAFKA_METADATA_LOG_REPLICATION_FACTOR: 1
    volumes:
      - ./kafka:/opt/kafka/scripts
    deploy:
      resources:
        limits:
          cpus: '0.5'    
          memory: 512M    
        reservations:
          cpus: '0.25'     
          memory: 256M

  kafka-connect:
    image: confluentinc/cp-kafka-connect:latest
    container_name: fraud-kafka-connect
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_started
    # UPDATED COMMAND: Automatically installs plugins on startup
    command: 
      - /bin/bash
      - -c
      - |
        echo "Installing ecosystem connector plugins..."
        confluent-hub install --no-prompt confluentinc/kafka-connect-elasticsearch:latest
        
        echo "Bypassing Confluent cub pre-flight checks..."
        /etc/confluent/docker/run
    environment:
      KAFKA_REST_BOOTSTRAP_SERVERS: "fraud-kafka:29092"
      CONNECT_BOOTSTRAP_SERVERS: "fraud-kafka:29092"
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: "fraud-connect-cluster"
      CONNECT_CONFIG_STORAGE_TOPIC: "connect-configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "connect-status"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_REST_ADVERTISED_HOST_NAME: "fraud-kafka-connect"
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xmx512m -Xms256m"
      # Explicitly tell Connect where to look for the downloaded plugins
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
    deploy:
      resources:
        limits:
          cpus: '0.5'    
          memory: 768M    
        reservations:
          cpus: '0.25'     
          memory: 384M

  
  redis:
    image: redis:7-alpine
    container_name: fraud-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    # --- OPTIMIZATION: Limit memory usage ---
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  elasticsearch:
    image: elasticsearch:8.19.4
    container_name: fraud-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # --- OPTIMIZATION: Force Elasticsearch to use minimal RAM ---
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1512M

  kibana:
    image: kibana:8.19.4
    container_name: fraud-kibana
    ports:
      - "5601:5601"
    environment:
      # --- OPTIMIZATION: Maximize Node.js memory limit inside Kibana ---
      - NODE_OPTIONS=--max-old-space-size=1024
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
        
volumes:
  kafka-data:
  redis_data:
